name: deep-scalper-5bots

on:
  push:
    branches:
      - bench/native-scalper-5bots-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  elvis_usdm_scalper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/ElvisTV/backtestingbots_s1.git candidate
          cd candidate
          git checkout 043c8c499bd47b33ca0d0fd2eb021fe992a2cfa4
      - name: Install
        run: python -m pip install pandas numpy matplotlib requests websockets python-dotenv cryptography
      - name: Prepare funding-neutral benchmark
        run: |
          cd candidate
          mkdir -p bench_data
          printf 'timestamp,funding_rate,mark_price\n' > bench_data/BTCUSDT_funding.csv
      - name: Run native scalping backtest
        run: |
          cd candidate
          set -o pipefail
          python btcusdt_usdm_scalping_backtester.py             --intervals 1m 5m             --start-month 2026-06             --end-month 2026-08             --data-dir bench_data             --output-dir bench_out             --initial-equity 1000 2>&1 | tee ../elvis.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elvis-usdm-scalper
          path: |
            elvis.log
            candidate/bench_out/

  libaceta_scalping_research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/libaceta/tradingbot.git candidate
          cd candidate
          git checkout 10bdfd01fd6dbf4a5b80c1719fdabe96f953bef7
      - name: Install
        run: python -m pip install requests pandas numpy
      - name: Prepare native report directory
        run: |
          sudo mkdir -p /app/strategies/scalping_research
          sudo chown -R "$USER":"$USER" /app
      - name: Run native strategies on immutable Binance USD-M data
        run: |
          cd candidate
          set -o pipefail
          python - <<'PY' 2>&1 | tee ../libaceta.log
          import csv, io, zipfile, urllib.request
          import pandas as pd
          import importlib.util
          from pathlib import Path

          path = Path("strategies/scalping_research/backtest_scalping.py")
          spec = importlib.util.spec_from_file_location("scalp_research", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          cache = {}
          def vision_frame(symbol, interval):
              key=(symbol,interval)
              if key in cache:
                  return cache[key].copy()
              frames=[]
              for month in ("2026-06","2026-07","2026-08"):
                  url=f"https://data.binance.vision/data/futures/um/monthly/klines/{symbol}/{interval}m/{symbol}-{interval}m-{month}.zip"
                  payload=urllib.request.urlopen(url, timeout=60).read()
                  z=zipfile.ZipFile(io.BytesIO(payload))
                  raw=list(csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]),encoding="utf-8")))
                  rows=[]
                  for r in raw:
                      if not r or not r[0].isdigit():
                          continue
                      rows.append([int(r[0]),float(r[1]),float(r[2]),float(r[3]),float(r[4]),float(r[5]),float(r[7])])
                  frames.append(pd.DataFrame(rows,columns=["ts","open","high","low","close","volume","turnover"]))
              df=pd.concat(frames,ignore_index=True).drop_duplicates("ts").sort_values("ts").reset_index(drop=True)
              df["datetime"]=pd.to_datetime(df["ts"],unit="ms")
              cache[key]=df
              print(f"loaded {symbol} {interval}m {len(df)} candles")
              return df.copy()

          mod.fetch_klines=lambda symbol, interval, days=90: vision_frame(symbol, interval)
          mod.DAYS_HISTORY=90
          mod.main()
          PY
      - name: Collect report
        if: always()
        run: |
          mkdir -p libaceta_out
          cp -f /app/strategies/scalping_research/* libaceta_out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libaceta-scalping-research
          path: |
            libaceta.log
            libaceta_out/

  dogan_scalping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/DoganAliSAN/scalping.git candidate
          cd candidate
          git checkout d731a98907e7cb0bdeb1262c631443a91a892440
      - name: Install
        run: python -m pip install python-binance pandas numpy requests pytz matplotlib
      - name: Run strategy on immutable Binance Vision data
        run: |
          cd candidate
          set -o pipefail
          python - <<'PY' 2>&1 | tee ../dogan.log
          import csv, io, zipfile, urllib.request, sys, types
          from datetime import datetime, timezone, timedelta, date
          import pandas as pd

          # Prevent import-time live Binance client creation. Strategy logic remains unchanged.
          stub=types.ModuleType("binance_live")
          stub.get_binance_client=lambda: object()
          sys.modules["binance_live"]=stub

          import backtest_month as bm

          frames={}
          for symbol in ("BTCUSDT","ETHUSDT"):
              parts=[]
              for month in ("2026-06","2026-07","2026-08"):
                  url=f"https://data.binance.vision/data/futures/um/monthly/klines/{symbol}/5m/{symbol}-5m-{month}.zip"
                  payload=urllib.request.urlopen(url,timeout=60).read()
                  z=zipfile.ZipFile(io.BytesIO(payload))
                  raw=list(csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]),encoding="utf-8")))
                  rows=[]
                  for r in raw:
                      if not r or not r[0].isdigit():
                          continue
                      rows.append([int(r[0]),float(r[1]),float(r[2]),float(r[3]),float(r[4]),float(r[5])])
                  parts.append(pd.DataFrame(rows,columns=["ts","open","high","low","close","volume"]))
              df=pd.concat(parts,ignore_index=True).drop_duplicates("ts").sort_values("ts")
              df["dt"]=pd.to_datetime(df["ts"],unit="ms",utc=True)
              frames[symbol]=df.reset_index(drop=True)
              print("loaded",symbol,len(df))

          def base_symbol(s):
              return str(s).replace("_PERP","").replace("/","").split(":")[0]

          def local_klines(symbol, market, interval, start_str, end_str, date_midnight_ny=None, **kwargs):
              key=base_symbol(symbol)
              df=frames[key]
              if date_midnight_ny is not None:
                  start=date_midnight_ny.astimezone(timezone.utc)
                  end=start+timedelta(days=1)
              else:
                  start=pd.Timestamp(start_str,tz="UTC").to_pydatetime()
                  end=pd.Timestamp(end_str,tz="UTC").to_pydatetime()
              sub=df[(df["dt"]>=start)&(df["dt"]<end)]
              return [[int(r.ts),r.open,r.high,r.low,r.close,r.volume] for r in sub.itertuples()]

          def local_first4h(symbol, market, date_midnight_ny, **kwargs):
              key=base_symbol(symbol)
              df=frames[key]
              start=date_midnight_ny.astimezone(timezone.utc)
              end=start+timedelta(hours=4)
              sub=df[(df["dt"]>=start)&(df["dt"]<end)]
              if sub.empty:
                  return None,None
              return float(sub["low"].min()),float(sub["high"].max())

          bm.get_klines=local_klines
          bm.get_first_4h_candle_levels=local_first4h

          dates=[]
          d=date(2026,6,1)
          end=date(2026,8,31)
          while d<=end:
              dates.append(d); d+=timedelta(days=1)
          today=datetime(2026,9,1,tzinfo=bm.NY_TZ)
          leverage=20.0
          cost_pct_per_trade=0.14*leverage  # 14 bps notional round-trip, expressed on margin at 20x

          for display in ("BTCUSDT_PERP","ETHUSDT_PERP"):
              symbol_for_api, market=bm.normalize_symbol_and_market(display)
              adj=[]
              raw=[]
              counts={"target":0,"breakeven":0,"liquidation":0,"stop":0}
              for d in dates:
                  midnight=datetime(d.year,d.month,d.day,tzinfo=bm.NY_TZ)
                  lo,hi=local_first4h(symbol_for_api,market,midnight)
                  if lo is None: continue
                  kl=local_klines(symbol_for_api,market,bm.Client.KLINE_INTERVAL_5MINUTE,"","",date_midnight_ny=midnight)
                  closed=[t for t in bm.run_strategy_positions_only(kl,lo,hi,midnight,leverage=leverage) if t["result"]!="open"]
                  for t in closed:
                      p=bm.calculate_leveraged_pnl_pct(t["entry"],t["exit_price"],t["side"],t.get("leverage",leverage))
                      raw.append(p)
                      adj.append(p-cost_pct_per_trade)
                      result=t["result"]
                      if result in counts: counts[result]+=1
                      elif result=="target": counts["target"]+=1
                      else: counts["stop"]+=1
              wins=[x for x in adj if x>0]; losses=[x for x in adj if x<0]
              pf=sum(wins)/abs(sum(losses)) if losses else (float("inf") if wins else 0.0)
              print("STANDARDIZED",display,
                    "trades=",len(adj),
                    "raw_expectancy_pct=",(sum(raw)/len(raw) if raw else 0.0),
                    "adjusted_expectancy_pct=",(sum(adj)/len(adj) if adj else 0.0),
                    "adjusted_pf=",pf,
                    "adjusted_win_rate=",(len(wins)/len(adj) if adj else 0.0),
                    "raw_total_pct_points=",sum(raw),
                    "adjusted_total_pct_points=",sum(adj),
                    "counts=",counts)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogan-scalping
          path: dogan.log

  dniskav_scalper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/dniskav/scalper-bot.git candidate
          cd candidate
          git checkout c6f2455f5bab34d0e11c4b351a23154782b7ef9a
      - name: Install
        run: python -m pip install -r candidate/deploy/requirements.txt
      - name: Download immutable Binance Vision 5m 90d window
        run: |
          python - <<'PY'
          import io, zipfile, urllib.request, csv
          rows=[]
          for month in ('2026-06','2026-07','2026-08'):
              url=f'https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/5m/BTCUSDT-5m-{month}.zip'
              data=urllib.request.urlopen(url, timeout=60).read()
              z=zipfile.ZipFile(io.BytesIO(data))
              for r in csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]), encoding='utf-8')):
                  if r and r[0].isdigit():
                      rows.append(r)
          rows.sort(key=lambda r:int(r[0]))
          with open('candidate/btcusdt_5m.csv','w',newline='') as f:
              w=csv.writer(f)
              for r in rows:
                  w.writerow([r[0],r[1],r[2],r[3],r[4],r[5]])
          print('candles', len(rows))
          PY
      - name: Run native CSV backtest
        run: |
          cd candidate
          set -o pipefail
          PYTHONPATH=src python -m ui.cli backtest btcusdt_5m.csv 2>&1 | tee ../dniskav.log
      - name: Standardize dniskav metrics with 14 bps round-trip cost
        run: |
          cd candidate
          python - <<'PY' | tee -a ../dniskav.log
          import csv, math
          p='data/backtest_trades.csv'
          rows=list(csv.DictReader(open(p))) if __import__('os').path.exists(p) else []
          rets=[]
          for r in rows:
              e=float(r['entry']); x=float(r['exit']); side=r['side']
              gross=(x/e-1.0) if side=='long' else (e/x-1.0)
              rets.append(gross-0.0014)
          wins=[x for x in rets if x>0]; losses=[x for x in rets if x<0]
          pf=sum(wins)/abs(sum(losses)) if losses else (float('inf') if wins else 0.0)
          print('STANDARDIZED trades=',len(rets),'win_rate=',(len(wins)/len(rets) if rets else 0.0),
                'expectancy=',(sum(rets)/len(rets) if rets else 0.0),'profit_factor=',pf,
                'net_return_sum=',sum(rets))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dniskav-scalper
          path: |
            dniskav.log
            candidate/data/backtest_trades.csv

  eye360_scalper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/kishore446/360-Crypto-Eye-Scalping-.git candidate
          cd candidate
          git checkout 46d1f154077c14007c4892cb3dc86394c8fd7cb6
      - name: Install
        run: python -m pip install -r candidate/requirements.txt pandas numpy
      - name: Run backtester on immutable Binance Vision data
        run: |
          cd candidate
          set -o pipefail
          python - <<'PY' 2>&1 | tee ../eye360.log
          import io, zipfile, urllib.request, csv
          import pandas as pd
          from bot.backtester import Backtester, CandleData

          rows=[]
          for month in ('2026-06','2026-07','2026-08'):
              url=f'https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/5m/BTCUSDT-5m-{month}.zip'
              payload=urllib.request.urlopen(url, timeout=60).read()
              z=zipfile.ZipFile(io.BytesIO(payload))
              raw=list(csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]),encoding='utf-8')))
              for r in raw:
                  if not r or not r[0].isdigit():
                      continue
                  rows.append((pd.to_datetime(int(r[0]),unit='ms',utc=True),float(r[1]),float(r[2]),float(r[3]),float(r[4]),float(r[5])))
          df=pd.DataFrame(rows,columns=['ts','open','high','low','close','volume']).set_index('ts')

          def to_candles(frame):
              return [CandleData(open=float(x.open),high=float(x.high),low=float(x.low),close=float(x.close),volume=float(x.volume)) for x in frame.itertuples()]

          agg={'open':'first','high':'max','low':'min','close':'last','volume':'sum'}
          df4h=df.resample('4h').agg(agg).dropna()
          df1d=df.resample('1D').agg(agg).dropna()
          bt=Backtester('BTC/USDT:USDT',to_candles(df),to_candles(df4h),to_candles(df1d),initial_capital=1000,risk_per_trade=0.01)
          result=bt.run()
          result.print_report()
          print(result.summary())
          adjusted=[t.pnl_pct/100.0-0.0014 for t in result.trades]
          wins=[x for x in adjusted if x>0]; losses=[x for x in adjusted if x<0]
          pf=sum(wins)/abs(sum(losses)) if losses else (float('inf') if wins else 0.0)
          print('STANDARDIZED trades=',len(adjusted),
                'win_rate=',(len(wins)/len(adjusted) if adjusted else 0.0),
                'expectancy=',(sum(adjusted)/len(adjusted) if adjusted else 0.0),
                'profit_factor=',pf,'net_return_sum=',sum(adjusted))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eye360-scalper
          path: eye360.log
