name: external-unchanged-benchmark-5

on:
  workflow_dispatch:
  push:
    branches:
      - research/sep25-96-hybrid-exit-v1
    paths:
      - .github/workflows/external-unchanged-benchmark-5.yml

permissions:
  contents: read

jobs:
  alpha_rptr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone untouched project
        run: git clone --depth 1 https://github.com/TheFourGreatErrors/alpha-rptr.git project
      - name: Install
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 8 Sep
        working-directory: project
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p ../results
          set -o pipefail
          python main.py --test --from 2026-09-08T00:00:00 --to 2026-09-09T00:00:00 --no-plot --no-html-report 2>&1 | tee ../results/sep08.log
      - name: Run 25 Sep
        working-directory: project
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          python main.py --test --from 2026-09-25T00:00:00 --to 2026-09-26T00:00:00 --no-plot --no-html-report 2>&1 | tee ../results/sep25.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-alpha-rptr
          path: results
          if-no-files-found: warn

  passivbot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone untouched project
        run: git clone --depth 1 https://github.com/enarjord/passivbot.git project
      - name: Install
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run 8 Sep
        working-directory: project
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p ../results
          set -o pipefail
          passivbot backtest configs/examples/default_trailing_martingale_long.json --start-date 2026-09-08 --end-date 2026-09-09 2>&1 | tee ../results/sep08.log
      - name: Run 25 Sep
        working-directory: project
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          passivbot backtest configs/examples/default_trailing_martingale_long.json --start-date 2026-09-25 --end-date 2026-09-26 2>&1 | tee ../results/sep25.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-passivbot
          path: results
          if-no-files-found: warn

  bino282:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone untouched project
        run: git clone --depth 1 https://github.com/bino282/binance-trading-bot.git project
      - name: Install
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 8 Sep
        working-directory: project
        run: |
          mkdir -p ../results
          set -o pipefail
          python backtest.py --config config/ZECUSDT_TEMPLATE.yaml --start-date 2026-09-08 --end-date 2026-09-09 --no-charts --output ../results/sep08 2>&1 | tee ../results/sep08.log
      - name: Run 25 Sep
        working-directory: project
        run: |
          set -o pipefail
          python backtest.py --config config/ZECUSDT_TEMPLATE.yaml --start-date 2026-09-25 --end-date 2026-09-26 --no-charts --output ../results/sep25 2>&1 | tee ../results/sep25.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-bino282
          path: results
          if-no-files-found: warn

  astolfu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKTEST_USE_PRODUCTION_DATA: "true"
      BINANCE_TESTNET_API_KEY: "public_data_only"
      BINANCE_TESTNET_API_SECRET: "public_data_only"
      MPLBACKEND: Agg
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone untouched project
        run: git clone --depth 1 https://github.com/Astolfu/trading-bot.git project
      - name: Install
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 8 Sep
        working-directory: project
        run: |
          mkdir -p ../results
          set -o pipefail
          python scripts/run_backtest.py --start 2026-09-08 --end 2026-09-09 --no-plot 2>&1 | tee ../results/sep08.log
      - name: Run 25 Sep
        working-directory: project
        run: |
          set -o pipefail
          python scripts/run_backtest.py --start 2026-09-25 --end 2026-09-26 --no-plot 2>&1 | tee ../results/sep25.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-astolfu
          path: results
          if-no-files-found: warn

  shafqat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone untouched project
        run: git clone --depth 1 https://github.com/Shafqat388/quant-trading-bot.git project
      - name: Install
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 8 Sep
        working-directory: project
        run: |
          mkdir -p ../results
          set -o pipefail
          python run_backtest.py --start 2026-09-08 --end 2026-09-09 2>&1 | tee ../results/sep08.log
      - name: Run 25 Sep
        working-directory: project
        run: |
          set -o pipefail
          python run_backtest.py --start 2026-09-25 --end 2026-09-26 2>&1 | tee ../results/sep25.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-shafqat
          path: results
          if-no-files-found: warn
