name: mavilimw-1h-50coin-v1

on:
  push:
    branches:
      - research/mavilimw-1h-50coin-v1
    paths:
      - scripts/mavilimw_1h_50coin.py
      - .github/workflows/mavilimw-1h-50coin-v1.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run MavilimW benchmark
        run: |
          python scripts/mavilimw_1h_50coin.py \
            --start 2026-06-24 \
            --end 2026-09-24 \
            --output-dir artifacts/mavilimw_1h_50coin_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mavilimw-1h-50coin-v1
          path: artifacts/mavilimw_1h_50coin_v1
          if-no-files-found: warn
          retention-days: 30
