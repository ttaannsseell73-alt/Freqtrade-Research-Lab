name: coin-strategy-lab-freqtrade-onegroup

on:
  push:
    branches:
      - foundation/coin-strategy-lab-v1
    paths:
      - .github/workflows/coin-strategy-lab-freqtrade-onegroup.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  onegroup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "freqtrade==2026.8"
          freqtrade create-userdir --userdir user_data
      - name: Download canonical router
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROUTER_RUN=$(gh run list \
            --workflow coin-strategy-lab-router-refresh.yml \
            --branch foundation/coin-strategy-lab-v1 \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          mkdir -p router
          gh run download "$ROUTER_RUN" --name coin-strategy-lab-router --dir router
      - name: Build one-group plan
        run: |
          python scripts/build_tier_a_execution_plan.py \
            --router-csv router/BEST_ROBUST_SETUP_BY_COIN.csv \
            --mode smoke \
            --max-groups 1 \
            --output-dir execution-plan
          cat execution-plan/execution_plan.json
      - name: Prepare data
        run: |
          python scripts/prepare_freqtrade_tier_a_data.py \
            --plan execution-plan/execution_plan.csv \
            --data-dir execution-data/binance \
            --workers 4
      - name: Run one-group offline Freqtrade
        run: |
          python scripts/run_tier_a_freqtrade_validation.py \
            --plan execution-plan/execution_plan.csv \
            --config config/freqtrade_coin_strategy_execution.json \
            --data-dir execution-data/binance \
            --strategy-path strategies \
            --fee-per-side 0.0005 \
            --slippage-bps-round-trip 5.0 \
            --output-dir execution-results
      - name: Show results
        if: always()
        run: |
          cat execution-results/execution_manifest.json 2>/dev/null || true
          cat execution-results/execution_summary.csv 2>/dev/null || true
          cat execution-results/failures.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-strategy-lab-freqtrade-onegroup
          path: |
            execution-plan
            execution-data/FREQTRADE_DATA_AUDIT.csv
            execution-results
          if-no-files-found: warn
          retention-days: 30
