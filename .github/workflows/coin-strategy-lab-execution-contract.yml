name: coin-strategy-lab-execution-contract

on:
  push:
    branches:
      - forward-active
    paths:
      - src/coin_strategy_lab/execution.py
      - src/coin_strategy_lab/binance_testnet.py
      - tests/test_execution_testnet.py
      - pyproject.toml
      - .github/workflows/coin-strategy-lab-execution-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,testnet]"
      - name: Execution contract tests
        run: |
          pytest -q \
            tests/test_active_runtime.py \
            tests/test_paper_state_api.py \
            tests/test_execution_testnet.py
