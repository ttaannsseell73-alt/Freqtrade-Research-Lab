name: coin-strategy-lab-freqtrade-smoke

on:
  push:
    branches:
      - foundation/coin-strategy-lab-v1
    paths:
      - .github/workflows/coin-strategy-lab-freqtrade-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  execution-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CoinStrategyLab and pinned Freqtrade
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "freqtrade==2026.8"
          freqtrade --version

      - name: Download latest successful canonical router
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROUTER_RUN=$(gh run list \
            --workflow coin-strategy-lab-router-refresh.yml \
            --branch foundation/coin-strategy-lab-v1 \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          test -n "$ROUTER_RUN"
          echo "router_run=$ROUTER_RUN"
          mkdir -p router
          gh run download "$ROUTER_RUN" \
            --name coin-strategy-lab-router \
            --dir router
          ls -lah router

      - name: Build 18-group Tier-A smoke plan
        run: |
          python scripts/build_tier_a_execution_plan.py \
            --router-csv router/BEST_ROBUST_SETUP_BY_COIN.csv \
            --mode smoke \
            --output-dir execution-plan
          cat execution-plan/execution_plan.json

      - name: Prepare Binance Vision candles in Freqtrade format
        run: |
          python scripts/prepare_freqtrade_tier_a_data.py \
            --plan execution-plan/execution_plan.csv \
            --data-dir execution-data/binance \
            --workers 12
          cat execution-data/FREQTRADE_DATA_AUDIT.csv

      - name: Run Freqtrade execution smoke
        run: |
          python scripts/run_tier_a_freqtrade_validation.py \
            --plan execution-plan/execution_plan.csv \
            --config config/freqtrade_coin_strategy_execution.json \
            --data-dir execution-data/binance \
            --strategy-path strategies \
            --fee-per-side 0.0005 \
            --slippage-bps-round-trip 5.0 \
            --output-dir execution-results

      - name: Print execution summary
        if: always()
        run: |
          cat execution-results/execution_manifest.json 2>/dev/null || true
          cat execution-results/execution_summary.csv 2>/dev/null || true
          cat execution-results/failures.json 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-strategy-lab-freqtrade-smoke
          path: |
            execution-plan
            execution-data/FREQTRADE_DATA_AUDIT.csv
            execution-results
          if-no-files-found: warn
          retention-days: 30
