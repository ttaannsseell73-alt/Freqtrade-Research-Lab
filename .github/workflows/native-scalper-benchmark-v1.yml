name: native-scalper-benchmark-v1

on:
  push:
    branches:
      - benchmark/native-scalpers-v1
    paths:
      - ".github/workflows/native-scalper-benchmark-v1.yml"
      - "benchmarks/native_scalpers_v1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smallfish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned Smallfish
        run: |
          git clone https://github.com/azseza/smallfish_.git candidate
          cd candidate
          git checkout e9a53c5a43f0dcb88d9ecd1b2130f7dac61b205f
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./candidate
      - name: Native engine on pinned common dataset
        run: |
          set -o pipefail
          python benchmarks/native_scalpers_v1/run_smallfish_local.py --candidate candidate --output smallfish_result.json 2>&1 | tee smallfish_local.log
      - uses: actions/upload-artifact@v4
        with:
          name: smallfish-local
          path: |
            smallfish_local.log
            smallfish_result.json

  ultra_scalping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned Ultra Scalping Bot
        run: |
          git clone https://github.com/ROMEROPS7/ultra-scalping-bot.git candidate
          cd candidate
          git checkout b47351ff8963d8e9f13aa91be91f8cbaf28025b9
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt
      - name: Native core backtester on pinned common dataset
        run: |
          set -o pipefail
          python benchmarks/native_scalpers_v1/run_ultra_local.py --candidate candidate --output ultra_result.json 2>&1 | tee ultra_local.log
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-local
          path: |
            ultra_local.log
            ultra_result.json

  jodi_orderflow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BINANCE_TESTNET: "false"
      INITIAL_BALANCE: "1000"
      LEVERAGE: "1"
      BACKTEST_LEVERAGE: "1"
      FEE_TAKER: "0.0014"
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned JODI Orderflow Scalper
        run: |
          git clone https://github.com/JODI96/Trader.git candidate
          cd candidate
          git checkout 4384b050464741c588fdcd0579e1c0b7d43863a4
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch' candidate/requirements.txt > /tmp/jodi-requirements.txt
          python -m pip install -r /tmp/jodi-requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Chronological 5d train plus 2d validation
        run: |
          set -o pipefail
          python benchmarks/native_scalpers_v1/run_jodi_local.py --candidate candidate --output jodi_result.json 2>&1 | tee jodi_local.log
      - uses: actions/upload-artifact@v4
        with:
          name: jodi-local
          path: |
            jodi_local.log
            jodi_result.json
            candidate/ml/model/**

  binance_go_scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BENCH_DATA_GLOB: ${{ github.workspace }}/benchmarks/native_scalpers_v1/data/BTCUSDT_1m_20260908_20260915_part*.json
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned Go Binance Scalp Bot
        run: |
          git clone https://github.com/wferreirauy/binance-bot.git candidate
          cd candidate
          git checkout 260bd2e13738b8c81d8f5f9918e004c6370f9b61
          git rev-parse HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Baseline project tests
        run: |
          cd candidate
          go test ./...
      - name: Run native scalp decision path on pinned fixture
        run: |
          cp benchmarks/native_scalpers_v1/go_local_benchmark_test.go candidate/strategy/native_fixture_benchmark_test.go
          cd candidate
          set -o pipefail
          go test ./strategy -run TestNativeScalpBullOnPinnedFixture -v 2>&1 | tee ../go_local.log
      - uses: actions/upload-artifact@v4
        with:
          name: go-scalp-local
          path: go_local.log

  eye360:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned 360 Crypto Eye
        run: |
          git clone https://github.com/kishore446/360-Crypto-Eye-Scalping-.git candidate
          cd candidate
          git checkout 46d1f154077c14007c4892cb3dc86394c8fd7cb6
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt
      - name: Project tests
        run: |
          cd candidate
          pytest tests -q
      - name: Native confluence backtester on pinned futures dataset
        run: |
          set -o pipefail
          python benchmarks/native_scalpers_v1/run_360eye_local.py --candidate candidate --output eye360_result.json 2>&1 | tee eye360_local.log
      - uses: actions/upload-artifact@v4
        with:
          name: eye360-local
          path: |
            eye360_local.log
            eye360_result.json
