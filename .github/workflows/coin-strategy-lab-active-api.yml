name: coin-strategy-lab-active-api

on:
  push:
    branches:
      - foundation/coin-strategy-lab-v1
    paths:
      - src/coin_strategy_lab/api.py
      - scripts/run_active_api.py
      - tests/test_active_api.py
      - pyproject.toml
      - docs/ACTIVE_API_V1.md
      - .github/workflows/coin-strategy-lab-active-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,api]"
      - run: pytest tests/test_active_api.py
      - name: API import smoke
        run: |
          python - <<'PY'
          from coin_strategy_lab.api import app
          assert app.title == "CoinStrategyLab Active Runtime API"
          print("api_ready")
          PY
