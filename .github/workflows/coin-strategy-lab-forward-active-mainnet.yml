name: coin-strategy-lab-forward-active-mainnet

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coin-strategy-lab-forward-active-mainnet
  cancel-in-progress: true

jobs:
  forward-active:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forward-active
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install canonical forward stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "freqtrade==2026.8"
          freqtrade create-userdir --userdir user_data
      - name: Build frozen 30-setup forward plan
        id: plan
        run: |
          END_DATE=$(date -u +%F)
          python scripts/build_forward_paper_plan.py             --cohort config/active_pool_v1.json             --end "$END_DATE"             --min-forward-days 1             --output-dir forward-active-plan
          READY=$(python - <<'PY'
          import json
          print(str(json.load(open("forward-active-plan/FORWARD_PLAN_MANIFEST.json"))["ready"]).lower())
          PY
          )
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
      - name: Prepare unseen Binance Vision candles
        if: steps.plan.outputs.ready == 'true'
        run: |
          cp forward-active-plan/forward_plan.csv forward-active-plan/execution_plan.csv
          python scripts/prepare_freqtrade_tier_a_data.py             --plan forward-active-plan/execution_plan.csv             --data-dir forward-active-data/binance             --workers 12
      - name: Run frozen 30-setup forward execution
        if: steps.plan.outputs.ready == 'true'
        run: |
          python scripts/run_tier_a_freqtrade_validation.py             --plan forward-active-plan/execution_plan.csv             --config config/freqtrade_coin_strategy_execution.json             --data-dir forward-active-data/binance             --strategy-path strategies             --fee-per-side 0.0005             --slippage-bps-round-trip 5.0             --output-dir forward-active-results
      - name: Print forward-active state
        if: always()
        run: |
          cat forward-active-plan/FORWARD_PLAN_MANIFEST.json
          if [ -f forward-active-results/execution_manifest.json ]; then
            cat forward-active-results/execution_manifest.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-strategy-lab-forward-active-mainnet
          path: |
            forward-active-plan
            forward-active-data/FREQTRADE_DATA_AUDIT.csv
            forward-active-results
          if-no-files-found: warn
          retention-days: 90
