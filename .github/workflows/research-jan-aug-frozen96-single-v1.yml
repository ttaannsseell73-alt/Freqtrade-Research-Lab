name: research-jan-aug-frozen96-single-v1

on:
  push:
    branches:
      - research/sep26-month-replay-v1
    paths:
      - .github/workflows/research-jan-aug-frozen96-single-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay_all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sep26-month-replay-v1
          fetch-depth: 0
      - name: Verify core strategy code frozen
        run: |
          git diff --exit-code b620587b955bf05c9f8e028bba563fb97ab5706b --             scripts/one_shot_yesterday_96.py             src/coin_strategy_lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Download exact frozen 96 PASS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source-artifact
          gh run download 36125698776 -n coin-strategy-lab-freqtrade-tier-a-full -D source-artifact
          test -f source-artifact/execution-plan/execution_plan.csv
          test -f source-artifact/execution-results/execution_pair_results.csv
      - name: Replay January through August
        run: |
          set -e
          mkdir -p historical-2026
          for m in 1 2 3 4 5 6 7 8; do
            echo "===== MONTH $m ====="
            python scripts/replay_frozen96_period.py               --plan source-artifact/execution-plan/execution_plan.csv               --metrics source-artifact/execution-results/execution_pair_results.csv               --year 2026               --month "$m"               --out "historical-2026/m$m"
          done
      - name: Aggregate Jan-Aug
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for m in range(1,9):
              p=Path(f"historical-2026/m{m}/MONTH_SUMMARY.json")
              x=json.loads(p.read_text())
              q=x["portfolio_1x"]
              rows.append({
                  "month":m,
                  "pnl":float(q["sum_pnl_fixed_10k"]),
                  "avg_daily":float(q["avg_daily_pnl"]),
                  "positive_days":int(q["positive_days"]),
                  "negative_days":int(q["negative_days"]),
                  "trades":int(q["trades"]),
                  "wins":int(q["wins"]),
                  "losses":int(q["losses"]),
                  "best_day":q["best_day"],
                  "worst_day":q["worst_day"],
              })
          report={
              "period":"2026-01-01..2026-08-31",
              "method":"same frozen 96 PASS portfolio logic as September; each day resets to 10,000 USDT; no compounding",
              "lookahead_note":"retrospective robustness only; the frozen 96 plan was selected later",
              "months":rows,
              "total_pnl_fixed_10k":sum(r["pnl"] for r in rows),
              "positive_months":sum(r["pnl"]>0 for r in rows),
              "negative_months":sum(r["pnl"]<0 for r in rows),
              "total_trades":sum(r["trades"] for r in rows),
              "total_wins":sum(r["wins"] for r in rows),
              "total_losses":sum(r["losses"] for r in rows),
          }
          Path("historical-2026/JAN_AUG_SUMMARY.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen96-2026-jan-aug-single
          path: historical-2026
          if-no-files-found: error
          retention-days: 30
