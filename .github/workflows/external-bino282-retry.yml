name: external-bino282-retry

on:
  workflow_dispatch:
  push:
    branches:
      - research/sep25-96-hybrid-exit-v1
    paths:
      - .github/workflows/external-bino282-retry.yml

permissions:
  contents: read

jobs:
  bino282:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone untouched project
        run: git clone --depth 1 https://github.com/bino282/binance-trading-bot.git project
      - name: Install runtime dependencies without changing project files
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install python-binance==1.0.19 ccxt==4.2.25 pandas==2.1.4 numpy==1.26.3 pyyaml==6.0.1 matplotlib==3.8.2 plotly==5.18.0 seaborn==0.13.1 aiohttp==3.9.1 asyncio==3.4.3 python-dateutil==2.8.2 pytz==2023.3 requests==2.31.0 colorlog==6.8.0 jsonschema==4.20.0
      - name: Run 8 Sep
        working-directory: project
        run: |
          mkdir -p ../results
          set -o pipefail
          python backtest.py --config config/ZECUSDT_TEMPLATE.yaml --start-date 2026-09-08 --end-date 2026-09-09 --no-charts --output ../results/sep08 2>&1 | tee ../results/sep08.log
      - name: Run 25 Sep
        working-directory: project
        run: |
          set -o pipefail
          python backtest.py --config config/ZECUSDT_TEMPLATE.yaml --start-date 2026-09-25 --end-date 2026-09-26 --no-charts --output ../results/sep25 2>&1 | tee ../results/sep25.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-bino282-retry
          path: results
          if-no-files-found: warn
