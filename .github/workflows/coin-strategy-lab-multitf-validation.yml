name: coin-strategy-lab-multitf-validation
# matrix-schema: timeframe-aware-v3
# canonical-strategy-set: qqe-pine-cross-v2

on:
  push:
    branches:
      - foundation/coin-strategy-lab-v1
    paths:
      - .github/workflows/coin-strategy-lab-multitf-validation.yml
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - timeframe: 15m
            start: 2026-03-24
            end: 2026-09-24
            artifact: coin-strategy-lab-15m-180d
          - timeframe: 4h
            start: 2025-09-24
            end: 2026-09-24
            artifact: coin-strategy-lab-4h-365d
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Run all-futures timeframe validation
        run: |
          python scripts/run_coin_strategy_lab_discovery.py \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --timeframe ${{ matrix.timeframe }} \
            --data-source vision \
            --workers 24 \
            --output-dir artifacts/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 30
