name: native-scalper-5bots

on:
  push:
    branches:
      - bench/native-scalper-5bots-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ultra_scalping_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/ROMEROPS7/ultra-scalping-bot.git candidate
          cd candidate
          git checkout b47351ff8963d8e9f13aa91be91f8cbaf28025b9
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt
      - name: Native backtest
        continue-on-error: true
        run: |
          cd candidate
          set -o pipefail
          python run_backtest.py --symbol BTC/USDT:USDT --timeframe 1m --days 7 --exchange binance --capital 1000 --commission 0.05 --compare 2>&1 | tee ../ultra.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultra-scalping-bot-log
          path: ultra.log
          if-no-files-found: warn

  smallfish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/azseza/smallfish_.git candidate
          cd candidate
          git checkout e9a53c5a43f0dcb88d9ecd1b2130f7dac61b205f
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml websockets aiohttp numpy orjson python-dotenv rich
      - name: Native backtest
        continue-on-error: true
        run: |
          cd candidate
          set -o pipefail
          python src/backtest.py --symbol BTCUSDT --days 7 --equity 1000 --mode aggressive --exchange binance --fees --interval 1 --maker-fee 0.0005 --taker-fee 0.0005 2>&1 | tee ../smallfish.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smallfish-log
          path: smallfish.log
          if-no-files-found: warn

  jodi_orderflow_rl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/JODI96/Trader.git candidate
          cd candidate
          git checkout 4384b050464741c588fdcd0579e1c0b7d43863a4
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt
      - name: Native backtest
        continue-on-error: true
        env:
          BINANCE_API_KEY: ""
          BINANCE_API_SECRET: ""
          BINANCE_TESTNET: "true"
          SYMBOL: "BTCUSDT"
          INITIAL_BALANCE: "1000"
        run: |
          cd candidate
          set -o pipefail
          python main.py --mode backtest --days 7 --symbol BTCUSDT 2>&1 | tee ../jodi.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jodi-trader-log
          path: jodi.log
          if-no-files-found: warn

  payjuper_binance_scalper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned project
        run: |
          git clone https://github.com/payjuper/binance-trading-framework.git candidate
          cd candidate
          git checkout 08307a700b3ebb981b361f62dda71d12cfc110ed
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt
      - name: Fetch 7d Binance Futures BTCUSDT 1m data
        run: |
          cd candidate/backtesting
          python - <<'PY'
          import requests, pandas as pd, time
          end_ms = int(time.time() * 1000)
          start_ms = end_ms - 7 * 24 * 60 * 60 * 1000
          rows = []
          cur = start_ms
          while cur < end_ms:
              r = requests.get("https://fapi.binance.com/fapi/v1/klines", params={"symbol":"BTCUSDT","interval":"1m","startTime":cur,"endTime":end_ms,"limit":1500}, timeout=30)
              r.raise_for_status()
              batch = r.json()
              if not batch:
                  break
              rows.extend(batch)
              cur = batch[-1][0] + 60_000
          cols = ["open_time","open","high","low","close","volume","close_time","quote_asset_volume","trades","taker_buy_base_vol","taker_buy_quote_vol","ignore"]
          df = pd.DataFrame(rows, columns=cols).drop_duplicates("open_time")
          df["datetime"] = pd.to_datetime(df["open_time"], unit="ms", utc=True)
          df.to_csv("btc_1m_merged.csv", index=False)
          print("candles", len(df))
          PY
      - name: Native backtest
        continue-on-error: true
        env:
          PLOTLY_RENDERER: json
        run: |
          cd candidate/backtesting
          set -o pipefail
          python - <<'PY' 2>&1 | tee ../../payjuper.log
          import plotly.graph_objects as go, runpy
          go.Figure.show = lambda self, *a, **k: None
          runpy.run_path("backtest1m.py", run_name="__main__")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payjuper-log
          path: payjuper.log
          if-no-files-found: warn

  futures_hero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Clone pinned project
        run: |
          git clone https://github.com/zyairelai/futures-hero.git candidate
          cd candidate
          git checkout 91a82ef960f86804b69b0d00eaec7f7864cf786f
      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ccxt numpy pandas requests termcolor python-binance
      - name: Native backtest
        continue-on-error: true
        run: |
          cd candidate
          set -o pipefail
          python backtest.py 2>&1 | tee ../futures_hero.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futures-hero-log
          path: futures_hero.log
          if-no-files-found: warn
