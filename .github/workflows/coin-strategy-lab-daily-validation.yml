name: coin-strategy-lab-daily-validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Run all-futures 1d validation
        run: |
          python scripts/run_coin_strategy_lab_discovery.py \
            --start 2024-09-24 \
            --end 2026-09-24 \
            --timeframe 1d \
            --data-source vision \
            --workers 24 \
            --output-dir artifacts/coin-strategy-lab-1d-730d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-strategy-lab-1d-730d
          path: artifacts/coin-strategy-lab-1d-730d
          if-no-files-found: warn
          retention-days: 30
