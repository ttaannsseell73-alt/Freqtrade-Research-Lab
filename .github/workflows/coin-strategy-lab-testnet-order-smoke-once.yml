name: coin-strategy-lab-testnet-order-smoke-once

on:
  push:
    branches:
      - forward-active
    paths:
      - .github/workflows/coin-strategy-lab-testnet-order-smoke-once.yml

permissions:
  contents: read

jobs:
  one-shot-testnet-order-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: binance-testnet
    env:
      BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      CSL_ALLOW_TESTNET_ORDERS: "YES"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forward-active
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testnet]"
      - name: Verify testnet credentials are configured
        run: |
          test -n "$BINANCE_TESTNET_API_KEY"
          test -n "$BINANCE_TESTNET_API_SECRET"
      - name: Full TESTNET order fill reconcile reduce-only smoke
        run: python scripts/testnet_execution_smoke.py --exercise-order
