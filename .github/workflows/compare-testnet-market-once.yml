name: compare-testnet-market-once

on:
  push:
    branches:
      - feat/active-shadow-paper-v1
    paths:
      - .github/workflows/compare-testnet-market-once.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Read TESTNET market sample
        run: |
          python - <<'PY'
          import json, httpx
          base="https://testnet.binancefuture.com"
          mark=httpx.get(base+"/fapi/v1/premiumIndex",params={"symbol":"SFPUSDT"},timeout=15).json()
          kl=httpx.get(base+"/fapi/v1/klines",params={"symbol":"SFPUSDT","interval":"4h","limit":3},timeout=15).json()
          print(json.dumps({"mark":mark,"klines":kl}))
          PY
