name: coin-strategy-lab-discovery

on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Full all-futures 365d discovery
        run: |
          python scripts/run_coin_strategy_lab_discovery.py \
            --start 2025-09-24 \
            --end 2026-09-24 \
            --data-source vision \
            --workers 24 \
            --output-dir artifacts/coin_strategy_lab_discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-strategy-lab-discovery-365d
          path: artifacts/coin_strategy_lab_discovery
          if-no-files-found: warn
          retention-days: 30
