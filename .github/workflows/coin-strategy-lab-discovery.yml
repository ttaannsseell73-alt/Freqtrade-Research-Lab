name: coin-strategy-lab-discovery

on:
  push:
    branches:
      - foundation/coin-strategy-lab-v1
    paths:
      - scripts/run_coin_strategy_lab_discovery.py
      - src/coin_strategy_lab/**
      - config/futures_universe_snapshot.json
      - .github/workflows/coin-strategy-lab-discovery.yml
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Smoke discovery
        run: |
          python scripts/run_coin_strategy_lab_discovery.py \
            --start 2026-06-24 \
            --end 2026-09-24 \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT \
            --data-source vision \
            --workers 6 \
            --output-dir artifacts/coin_strategy_lab_discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-strategy-lab-discovery-smoke
          path: artifacts/coin_strategy_lab_discovery
          if-no-files-found: warn
          retention-days: 14
