name: coin-strategy-lab-shadow-smoke

on:
  push:
    branches:
      - feat/active-shadow-paper-v1
    paths:
      - .github/workflows/coin-strategy-lab-shadow-smoke.yml
      - scripts/run_active_shadow.py
      - src/coin_strategy_lab/shadow.py
      - src/coin_strategy_lab/public_market.py
      - src/coin_strategy_lab/intent.py
      - config/active_evidence_v1.json
      - config/tradability_policy_v1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testnet]"
      - name: Run one shadow scan
        run: |
          python scripts/run_active_shadow.py --output-dir shadow-paper
          cat shadow-paper/SHADOW_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-strategy-lab-shadow-smoke
          path: shadow-paper
          if-no-files-found: warn
          retention-days: 7
