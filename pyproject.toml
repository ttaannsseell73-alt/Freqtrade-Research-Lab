[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "freqtrade-research-lab"
version = "0.1.0"
description = "Reproducible Binance USDT-M strategy, coin, and timeframe research"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "fastapi>=0.115", "httpx>=0.27"]
research = ["vectorbt>=1.1.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
testnet = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
